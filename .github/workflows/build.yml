name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-build:
    name: Build .NET samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build MAF-Agents-Samples.slnx --configuration Release

  go-build:
    name: Build and test Go samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [20-MAF-Agent-GO, 21-MAF-Agent-GO-Hosted]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  cpp-build:
    name: Build and test C++ samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [40-Foundry-Agent-CPP, 41-Foundry-Agent-CPP-Hosted]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('4[01]-*CPP*/vcpkg.json', '4[01]-*CPP*/vcpkg-configuration.json') }}

      - name: Configure
        working-directory: ${{ matrix.module }}
        run: cmake --preset debug

      - name: Build
        working-directory: ${{ matrix.module }}
        run: cmake --build --preset debug

      - name: Test
        working-directory: ${{ matrix.module }}
        run: ctest --preset debug
