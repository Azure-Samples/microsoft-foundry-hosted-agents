name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-build:
    name: Build .NET samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build MAF-Agents-Samples.slnx --configuration Release

  go-build:
    name: Build and test Go samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [MAF-Agent-GO-03, MAF-Agent-GO-04]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
