name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet-build:
    name: Build .NET samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build MAF-Agents-Samples.slnx --configuration Release

  go-build:
    name: Build and test Go samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [20-MAF-Agent-GO, 21-MAF-Agent-GO-Hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  cpp-build:
    name: Build and test C++ samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [40-Foundry-Agent-CPP, 41-Foundry-Agent-CPP-Hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('4[01]-*CPP*/vcpkg.json', '4[01]-*CPP*/vcpkg-configuration.json') }}

      - name: Configure
        working-directory: ${{ matrix.module }}
        run: cmake --preset debug

      - name: Build
        working-directory: ${{ matrix.module }}
        run: cmake --build --preset debug

      - name: Test
        working-directory: ${{ matrix.module }}
        run: ctest --preset debug
