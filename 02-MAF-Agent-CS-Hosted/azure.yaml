# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: ">=1.27.1"
    extensions:
        azure.ai.agents: ">=1.0.0-beta.8"
        azure.ai.projects: ">=1.0.0-beta.4"

name: maf-agent-cs-02
services:
    foundry-project:
        host: azure.ai.project
        endpoint: <your-foundry-project-endpoint> # e.g. https://<your-resource>.services.ai.azure.com/api/projects/<your-project>
    maf-agent-cs-02:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - foundry-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: 02-MAF-Agent-CS-Hosted.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: maf-agent-cs-02
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
